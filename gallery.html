<title>Food & Moments | Sudh Vaishno Tandoor</title><link rel="stylesheet" href="style.css?v=14"><style>body.gallery-page{background:#fffaf4}.gallery-page-main{min-height:100vh;padding:120px 20px 70px;max-width:1180px;margin:auto}.gallery-page-head{text-align:center;max-width:760px;margin:0 auto 34px}.gallery-page-head h1{font-size:clamp(34px,5vw,58px);margin:10px 0}.gallery-page-head p{color:#756960;font-size:16px;line-height:1.7}.gallery-back{display:inline-flex;align-items:center;gap:8px;margin-bottom:22px;padding:10px 14px;border-radius:12px;background:#fff;border:1px solid #eaded5;font-weight:800;color:#201b17}.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.gallery-page-card{position:relative;overflow:hidden;border-radius:20px;background:#fff;border:1px solid #eaded5;box-shadow:0 10px 28px rgba(45,29,18,.07);aspect-ratio:4/3}.gallery-page-card img,.gallery-page-card video{width:100%;height:100%;display:block;object-fit:cover}.gallery-page-caption{position:absolute;left:0;right:0;bottom:0;padding:30px 16px 14px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.76));font-weight:700;font-size:14px}.gallery-loading{text-align:center;color:#756960;padding:40px}.gallery-empty{text-align:center;padding:50px 20px;border:1px dashed #dbcfc5;border-radius:20px;color:#756960}.gallery-video-badge{position:absolute;top:12px;right:12px;background:#f04b25;color:#fff;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:800;z-index:2}@media(max-width:800px){.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.gallery-page-main{padding:100px 14px 50px}}@media(max-width:520px){.gallery-grid{grid-template-columns:1fr}.gallery-page-card{aspect-ratio:1/1}}</style></head><body class="gallery-page"><header class="topbar" style="position:fixed"><a class="brand" href="index.html#home" aria-label="Sudh Vaishno Tandoor home"><span class="brand-mark"><img src="assets/photos/logo.png" alt="Sudh Vaishno Tandoor"></span><span><strong>Sudh Vaishno Tandoor</strong><small>Pure Vegetarian • Since 1996</small></span></a><nav class="desktop-nav" aria-label="Main navigation"><a href="index.html#home">Home</a><a href="index.html#menu">Menu</a><a href="index.html#langar">Langar Seva</a><a class="active" href="gallery.html">Photos</a><a href="index.html#about">About</a><a href="index.html#reviews">Reviews</a><a href="index.html#contact">Contact</a></nav><a class="btn btn-primary nav-order" href="index.html#menu">Order Food</a></header><main class="gallery-page-main"><a class="gallery-back" href="index.html#photos">← Back to website</a><div class="gallery-page-head"><span class="eyebrow">FOOD & MOMENTS</span><h1>A taste of our kitchen</h1><p>Explore all photos and videos uploaded from Sudh Vaishno Tandoor.</p></div><div id="galleryPageStatus" class="gallery-loading">Loading gallery…</div><div id="galleryPageGrid" class="gallery-grid"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=14"></script><script>(async()=>{const st=document.getElementById('galleryPageStatus'),grid=document.getElementById('galleryPageGrid');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));try{if(!supabaseClient)throw new Error('Gallery connection is unavailable.');const {data,error}=await supabaseClient.from('site_photos').select('id,title,caption,media_type,public_url').eq('category','gallery').order('id',{ascending:false}).limit(200);if(error)throw error;const rows=data||[];if(!rows.length){st.textContent='No Food & Moments photos or videos have been uploaded yet.';st.className='gallery-empty';return}st.style.display='none';grid.innerHTML=rows.map(r=>{const t=r.caption||r.title||'Sudh Vaishno Tandoor';if(r.media_type==='video')return `<article class="gallery-page-card"><span class="gallery-video-badge">▶ VIDEO</span><video src="${esc(r.public_url)}" controls muted playsinline preload="metadata"></video><div class="gallery-page-caption">${esc(t)}</div></article>`;return `<article class="gallery-page-card"><img src="${esc(r.public_url)}" alt="${esc(t)}" loading="lazy"><div class="gallery-page-caption">${esc(t)}</div></article>`}).join('')}catch(e){st.textContent='Gallery could not load: '+(e.message||e);st.className='gallery-empty'}})();</script></body></html>
